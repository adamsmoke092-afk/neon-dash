  }

    var txt = DIFF.label + (modeId === 'daily' ? ' \u00B7 ' + game.seedTxt : '');

  }

    glowText(String(Math.floor(game.score)), 26, 40, 34, TH.text, 'left', 800);
    glowText('BEST ' + game.best, 26, 70, 15, TH.dim, 'left', 700, TH.accent);
    glowText('\u25C6 ' + game.orbs, W - 112, 40, 20, TH.gold, 'right', 800);
    if (boss) drawBossBar();

    var k = hard();
    var bw = 190;
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rrect(26, H - 34, bw, 8, 4);
    ctx.fill();
    ctx.fillStyle = linGrad(ctx, 26, 0, 26 + bw, 0, [[0, TH.accent], [1, TH.accent2]]);
    rrect(26, H - 34, Math.max(6, bw * k), 8, 4);
    ctx.fill();
    glowText('SPEED', 26, H - 50, 12, TH.dim, 'left', 700, TH.accent);

    var cbw = 150, cx0 = 26 + bw + 26, full = game.charge >= CHARGE_MAX;
    for (var ci = 0; ci < CHARGE_MAX; ci++) {
      var segX = cx0 + ci * (cbw / CHARGE_MAX);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      rrect(segX + 1, H - 34, cbw / CHARGE_MAX - 3, 8, 4);

      if (fillAmt > 0) {
        ctx.fillStyle = full ? TH.gold : TH.accent;
        ctx.globalAlpha = full ? 0.7 + 0.3 * Math.sin(game.time * 8) : 1;
        rrect(segX + 1, H - 34, Math.max(3, (cbw / CHARGE_MAX - 3) * fillAmt), 8, 4);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    glowText(full ? 'CANNON READY \u00B7 F' : 'GRAZE TO CHARGE', cx0, H - 50, 12,
             full ? TH.gold : TH.dim, 'left', 700, full ? TH.gold : TH.accent);

  function skinCardAt(p) {
    for (var i = 0; i < SKINS.length; i++) {

  /* ================================================================== *
   * 16. Main loop
   * ================================================================== */

  var last = 0;

  // Android can background for minutes then restore. On the way back: drop any
  // held inputs (a finger "held" across backgrounding otherwise reads as a
  // permanent jump), restart audio (OEM ROMs suspend the context silently), and
  // reset the frame clock so the clamped dt does not fire one giant step.
  function onResume() {
    jumpHeld = false;
    player.slideHold = false;
    if (actx && actx.state === 'suspended') {
      try { actx.resume(); } catch (e) { /* ignore */ }
    }
    last = 0;
  }

  buildCaches();
  if (metaTheme) metaTheme.setAttribute('content', TH.meta);

  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 1 / 20) dt = 1 / 20;
    if (exitArm > 0) exitArm -= dt;

    if (state === 'play') {
      updateFx(dt);
      updateScore(dt);
      updateWorld(dt);
      updatePlayer(dt);
      if (!player.dead) checkCollisions(dt);
    } else if (state === 'menu') {
      game.menuT += dt;
      game.time += dt;
      game.worldX += DIFF.base * 0.6 * dt;
      game.speed = DIFF.base;
      while (game.worldX >= game.nextSpawn) spawnFeature();
      moveWorld(DIFF.base * 0.6, dt);
    } else if (state === 'over') {
      game.overT += dt;
      game.time += dt;
      moveWorld(curSpeed() * 0.2, dt);
    } else {
      game.time += dt * 0.15;
    }

    updateParts(dt);
    musicTick(state === 'play');
    game.shake *= Math.pow(0.0025, dt);
    if (game.shake < 0.05) game.shake = 0;
    game.hitFlash = Math.max(0, game.hitFlash - dt * 2.2);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = TH.ground;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var vk = view.dpr * view.scale;
    ctx.setTransform(vk, 0, 0, vk, view.dpr * view.cx, view.dpr * view.cy);
    ctx.rotate(view.rot);
    var sh = game.shake;
    if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));
    ctx.translate(-W / 2, -H / 2);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    drawBackground();
    drawOrbs();
    drawPups();
    drawObstacles();
    drawSightline();
    drawBolts();
    drawBoss();
    if (state !== 'menu') drawGhost();
    if (state !== 'menu' && !player.dead) drawPlayer();
    drawParts();

    if (game.hitFlash > 0) {
      ctx.fillStyle = 'rgba(244,114,182,' + (game.hitFlash * 0.35).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'play') {
      drawHud();
      drawTouchPads();
      if (game.pupMsgT > 0) {
        ctx.globalAlpha = clamp(game.pupMsgT / 0.5, 0, 1);
        glowText(game.pupMsg, W / 2, 158, 22, TH.gold, 'center', 900);
        ctx.globalAlpha = 1;
      }
      if (game.flashT > 0) {
        ctx.globalAlpha = clamp(game.flashT / 0.5, 0, 1);
        glowText(game.flashTxt, W / 2, 116, 30, TH.gold, 'center', 900);
        ctx.globalAlpha = 1;
      }
    } else if (state === 'menu') drawMenu();
    else if (state === 'pause') { drawHud(); drawPause(); }
    else drawOver();

    drawToasts(dt);

    ctx.fillStyle = C.vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
