<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="trail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Speed trail: implies motion, reads at 48px -->
  <rect x="6" y="44" width="42" height="12" rx="6" fill="url(#trail)"/>
  <rect x="12" y="62" width="34" height="8" rx="4" fill="url(#trail)" opacity="0.35"/>

  <!-- Character: same proportions as in-game, tilted forward for action -->
  <g transform="rotate(-7, 60, 54)">
    <rect x="42" y="20" width="36" height="54" rx="13" fill="url(#body)"/>
    <rect x="48" y="30" width="24" height="11" rx="5.5" fill="#0b0320"/>
    <rect x="51" y="33" width="11" height="4.5" rx="2" fill="#fde047"/>
    <line x1="54" y1="72" x2="48" y2="82" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
    <line x1="66" y1="72" x2="72" y2="80" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Gold orb pickup: ties to gameplay, adds a second accent colour -->
  <circle cx="88" cy="28" r="6" fill="#fde047" opacity="0.85"/>
</svg>
